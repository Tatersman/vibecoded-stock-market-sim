</style></head><body><div id="app"></div><script>
const stocks=[['AAPL','Apple Inc.',189.98,1.24,'#b8c4d5'],['NVDA','NVIDIA Corporation',875.28,3.42,'#a8e063'],['MSFT','Microsoft Corporation',425.52,.86,'#82aaff'],['GOOGL','Alphabet Inc.',176.33,-.54,'#f8ca73'],['AMZN','Amazon.com Inc.',185.99,1.67,'#e7a15b'],['TSLA','Tesla, Inc.',177.46,-2.13,'#ef888e']].map(([symbol,name,price,change,color])=>({symbol,name,price,change,color}));
let saved;try{saved=JSON.parse(localStorage.getItem('marketlab-v1'))}catch{}
let state=saved&&Number.isFinite(saved.cash)&&saved.holdings&&Array.isArray(saved.orders)?saved:{cash:100000,holdings:{},orders:[]};
let selected=stocks[0],side='buy',range='1D',view='Overview',query='';
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD'});const pct=n=>`${n>=0?'+':''}${n.toFixed(2)}%`;const equity=()=>state.cash+stocks.reduce((n,s)=>n+(state.holdings[s.symbol]?.qty||0)*s.price,0);const save=()=>localStorage.setItem('marketlab-v1',JSON.stringify(state));
function chart(){let points=Array.from({length:65},(_,i)=>{let seed=selected.symbol.charCodeAt(0)+range.charCodeAt(0);return [i*10,155-i*.95+Math.sin(i*.7+seed)*13+Math.sin(i*1.9+seed)*7]});let line=points.map(p=>p.join(',')).join(' ');return `<svg class="chart" viewBox="0 0 640 220" role="img" aria-label="Illustrative ${selected.symbol} ${range} price trend"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b8ed80" stop-opacity=".22"/><stop offset="1" stop-color="#b8ed80" stop-opacity="0"/></linearGradient></defs>${[40,90,140,190].map(y=>`<path d="M0 ${y}H640" stroke="#252c34" stroke-dasharray="3 5"/>`).join('')}<polygon points="0,220 ${line} 640,220" fill="url(#fill)"/><polyline points="${line}" fill="none" stroke="#b8ed80" stroke-width="2.5" stroke-linejoin="round"/></svg>`}
function render(){let total=equity(),positions=stocks.filter(s=>state.holdings[s.symbol]?.qty>0);document.querySelector('#app').innerHTML=`
<aside><a class="brand" href="#"><span class="logo">m<span>↗</span></span>market<span class="muted">lab</span><small>SIMULATOR</small></a><div class="workspace"><span class="avatar">P</span><div>Personal workspace<small>Free paper trading account</small></div><span>⌄</span></div><p class="nav-label">WORKSPACE</p><nav>${[['Overview','◫'],['Portfolio','◴'],['Activity','⇄']].map(([n,i])=>`<button data-view="${n}" class="${view===n?'active':''}"><span>${i}</span>${n}${n==='Overview'?'<b>⌘ 1</b>':''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="practice"><span>✧</span><h3>Real practice. Zero risk.</h3><p>Build your investing confidence with virtual money.</p><div>Paper trading mode <i></i></div></div><div class="profile"><span class="avatar">JD</span><div>Your trading account<small>Individual · USD</small></div></div></div></aside>
<main><header><div class="breadcrumb">Workspace <span>/</span> <strong>${view}</strong></div><div class="header-right"><span class="status-dot"></span> Simulation active <span class="divider"></span><span class="demo-badge">PAPER ACCOUNT</span></div></header><div class="content"><div class="page-heading"><div><div class="eyebrow">YOUR MARKET, YOUR MOVE</div><h1>${view==='Overview'?'A little practice. A lot of potential.':view==='Portfolio'?'Your portfolio, at a glance.':'Every trade tells a story.'}</h1><p>${view==='Overview'?'Explore the market, test your instincts, and build your portfolio.':view==='Portfolio'?'Keep track of your positions and your available buying power.':'Review the moves you’ve made in your paper trading account.'}</p></div><span class="live-label"><i></i> Simulated market</span></div>
<section class="stats"><article><span>Total portfolio value <span>↗</span></span><h2>${money(total)}</h2><small class="positive">${pct((total-100000)/1000)} <em>since you started</em></small></article><article><span>Available cash <span>◈</span></span><h2>${money(state.cash)}</h2><small>Ready for your next move</small></article><article><span>Invested capital <span>▥</span></span><h2>${money(total-state.cash)}</h2><small>${positions.length} active position${positions.length===1?'':'s'} in your portfolio</small></article></section>
${view==='Activity'?`<section class="panel"><div class="panel-heading"><h3>Order history</h3><span>${state.orders.length} trades</span></div>${orders()}</section>`:view==='Portfolio'?`<section class="panel"><div class="panel-heading"><h3>Your holdings</h3><span>Current simulated valuations</span></div>${positions.length?`<div class="table-wrap"><table><thead><tr><th>Company</th><th>Shares</th><th>Average cost</th><th>Market value</th><th>Return</th></tr></thead><tbody>${positions.map(s=>{let h=state.holdings[s.symbol];return `<tr><td><b>${s.symbol}</b><small>${s.name}</small></td><td>${h.qty}</td><td>${money(h.avg)}</td><td>${money(h.qty*s.price)}</td><td class="${s.price>=h.avg?'positive':'negative'}">${money((s.price-h.avg)*h.qty)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Your portfolio starts with your first trade.<br><small>Head to Overview to explore stocks and place an order.</small></div>'}</section>`:`<div class="trading-grid"><section class="panel market"><div class="panel-heading"><h3>Market overview</h3><label class="search">⌕ <input id="search" placeholder="Search stocks…" aria-label="Search stocks" value="${escapeHtml(query)}"></label></div><div class="table-wrap"><table><thead><tr><th>Company</th><th>Price</th><th>Today</th><th class="trend-column">7D trend</th></tr></thead><tbody id="stock-rows">${rows()}</tbody></table></div><div class="market-note"><span>◷</span> Illustrative prices · For learning, not investment advice</div></section><section class="panel trade"><div class="panel-heading"><h3>Place an order</h3><span class="pill">Market order</span></div><div class="trade-company"><span class="company-icon" style="--icon:${selected.color}">${selected.symbol.slice(0,1)}</span><div><b>${selected.symbol}</b><small>${selected.name}</small></div><strong>${money(selected.price)}</strong></div><div class="switch"><button data-side="buy" class="${side==='buy'?'chosen':''}">Buy</button><button data-side="sell" class="${side==='sell'?'chosen':''}">Sell</button></div><label class="quantity-label" for="quantity">Number of shares <span>Whole shares</span></label><div class="quantity"><button id="minus" aria-label="Decrease quantity">−</button><input id="quantity" type="number" min="1" step="1" value="1" aria-label="Number of shares"><button id="plus" aria-label="Increase quantity">+</button></div><div class="order-detail"><span>Price per share</span><b>${money(selected.price)}</b></div><div class="order-detail"><span>Estimated total</span><strong id="estimate">${money(selected.price)}</strong></div><button class="order-button" id="submit-order">${side==='buy'?'Buy':'Sell'} ${selected.symbol} <span>↗</span></button><p class="buying-power">${side==='buy'?`${money(state.cash)} buying power`:`${state.holdings[selected.symbol]?.qty||0} shares available to sell`}</p><div id="order-message" role="status"></div></section><section class="panel performance"><div class="panel-heading"><div><h3>${selected.name} <span class="subtle">${selected.symbol}</span></h3><div class="chart-price">${money(selected.price)} <small class="${selected.change>=0?'positive':'negative'}">${pct(selected.change)} today</small></div></div><div class="ranges">${['1D','1W','1M','3M','1Y'].map(r=>`<button data-range="${r}" class="${r===range?'selected':''}">${r}</button>`).join('')}</div></div>${chart()}<div class="chart-times">${({'1D':['9:30 AM','11:00 AM','12:30 PM','2:00 PM','4:00 PM'],'1W':['Mon','Tue','Wed','Thu','Fri'],'1M':['Week 1','Week 2','Week 3','Week 4'],'3M':['Month 1','Month 2','Month 3'],'1Y':['Jan','Apr','Jul','Oct','Dec']}[range]).map(t=>`<span>${t}</span>`).join('')}</div><div class="chart-caption">Illustrative trend · ${range} view · Not historical market data</div></section><section class="panel insight"><span class="insight-tag">THE LONG GAME</span><div class="insight-art">↗<span>✧</span></div><h3>Great investors<br>start with curiosity.</h3><p>Try a strategy. Make a trade. Learn something new. This is your space to figure it out.</p><span class="insight-footer">Small steps. Smarter decisions. <span>↗</span></span></section></div>`}
<footer><span><i></i> All the experience. None of the financial risk.</span><span>Market Lab © ${new Date().getFullYear()} <span>•</span> Built for the learning curve.</span></footer></div></main>`;bind()}
function rows(){let list=stocks.filter(s=>`${s.symbol} ${s.name}`.toLowerCase().includes(query.toLowerCase()));return list.length?list.map(s=>`<tr data-stock="${s.symbol}" tabindex="0" role="button" aria-label="Trade ${s.name}" class="${s===selected?'selected-row':''}"><td><div class="company"><span class="company-icon" style="--icon:${s.color}">${s.symbol[0]}</span><div><b>${s.symbol}</b><small>${s.name}</small></div></div></td><td>${money(s.price)}</td><td class="${s.change>=0?'positive':'negative'}">${pct(s.change)}</td><td class="trend-column"><svg width="78" height="28" viewBox="0 0 78 28" aria-hidden="true"><polyline points="0,${s.change>0?22:6} 8,15 16,19 23,9 31,14 40,8 49,13 59,${s.change>0?5:20} 68,${s.change>0?9:17} 78,${s.change>0?2:25}" fill="none" stroke="${s.change>0?'#b8ed80':'#ee8e97'}" stroke-width="1.7"/></svg></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No matching stocks.</td></tr>'}
function orders(){return state.orders.length?`<div class="table-wrap"><table><thead><tr><th>Order</th><th>Shares</th><th>Price</th><th>Total</th><th>Time</th></tr></thead><tbody>${state.orders.map(o=>`<tr><td><b class="${o.side==='buy'?'positive':'negative'}">${o.side.toUpperCase()} ${o.symbol}</b></td><td>${o.qty}</td><td>${money(o.price)}</td><td>${money(o.qty*o.price)}</td><td>${new Date(o.time).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No trades yet.<br><small>Your completed orders will appear here.</small></div>'}
function bindRows(){document.querySelectorAll('[data-stock]').forEach(el=>{let choose=()=>{selected=stocks.find(s=>s.symbol===el.dataset.stock);render()};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}})}
function bind(){document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{side=b.dataset.side;render()});document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{range=b.dataset.range;render()});bindRows();let search=document.querySelector('#search');if(search)search.oninput=e=>{query=e.target.value;document.querySelector('#stock-rows').innerHTML=rows();bindRows()};let q=document.querySelector('#quantity');if(!q)return;let update=()=>{document.querySelector('#estimate').textContent=money((Number(q.value)||0)*selected.price)};q.oninput=update;document.querySelector('#minus').onclick=()=>{q.value=Math.max(1,(Number(q.value)||1)-1);update()};document.querySelector('#plus').onclick=()=>{q.value=(Number(q.value)||0)+1;update()};document.querySelector('#submit-order').onclick=()=>{let qty=Number(q.value),cost=qty*selected.price,h=state.holdings[selected.symbol]||{qty:0,avg:0},message=document.querySelector('#order-message');let error=!Number.isSafeInteger(qty)||qty<1?'Enter a positive whole number of shares.':side==='buy'&&cost>state.cash?'Not enough buying power for this order.':side==='sell'&&qty>h.qty?'You don’t own enough shares to sell.':null;if(error){message.textContent=error;message.className='error';return}if(side==='buy'){state.holdings[selected.symbol]={qty:h.qty+qty,avg:(h.avg*h.qty+cost)/(h.qty+qty)};state.cash-=cost}else{h.qty-=qty;state.holdings[selected.symbol]=h;state.cash+=cost}state.orders.unshift({side,symbol:selected.symbol,qty,price:selected.price,time:Date.now()});save();render();let msg=document.querySelector('#order-message');msg.className='success';msg.textContent=`${side==='buy'?'Bought':'Sold'} ${qty} ${selected.symbol} share${qty===1?'':'s'} for ${money(cost)}.`}}
render();
</script></body></html>
